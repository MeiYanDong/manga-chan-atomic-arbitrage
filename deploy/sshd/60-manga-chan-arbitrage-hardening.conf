# Administration is key-only. Root remains available through the dedicated
# deployment key and Alibaba Cloud Assistant recovery path.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3

# Forwarding stays closed except for a client-local tunnel to the read-only
# opportunity board. GatewayPorts keeps that client listener non-public.
X11Forwarding no
AllowTcpForwarding local
PermitOpen 127.0.0.1:8788
PermitTunnel no
GatewayPorts no
