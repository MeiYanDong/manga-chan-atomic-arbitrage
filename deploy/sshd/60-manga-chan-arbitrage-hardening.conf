# Administration is key-only. Root remains available through the dedicated
# deployment key and Alibaba Cloud Assistant recovery path.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
MaxAuthTries 3

# The headless watcher does not need forwarding or graphical sessions.
X11Forwarding no
AllowTcpForwarding no
PermitTunnel no
GatewayPorts no
