[Service]
# Optional same-host bridge. It grants read access only to the atomic-cycle
# group's sanitized /run heartbeat; the private state directory and signer
# credential remain mode 0700/0600 and outside this service.
SupplementaryGroups=atomic-cycle
Environment=MANGA_BUSINESS_BASE_HEARTBEAT_PATH=/run/atomic-cycle-portfolio/heartbeat.json
ReadOnlyPaths=-/run/atomic-cycle-portfolio
