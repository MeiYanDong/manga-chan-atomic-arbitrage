proxy_cache_path /var/cache/nginx/manga-public-dashboard
    levels=1:2
    keys_zone=manga_public_dashboard:10m
    max_size=64m
    inactive=7d
    use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/manga-chan-arbitrage/current/public;

    server_tokens off;
    client_max_body_size 1k;
    access_log /var/log/nginx/manga-public-dashboard.access.log;
    error_log /var/log/nginx/manga-public-dashboard.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    location = /healthz {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
    }

    location ^~ /api/v1/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;

        # The board also performs bounded market discovery. Keep one short-lived
        # presentation read model in Nginx so browser refreshes cannot stampede
        # or wait behind that process's event loop. A stale response is visibly
        # timestamped by the payload and remains preferable to a blank console.
        proxy_cache manga_public_dashboard;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 30s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 2s;
        proxy_cache_lock_age 8s;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Dashboard-Cache $upstream_cache_status always;
    }

    location = /api {
        return 404;
    }

    location = /api/v1 {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = / {
        limit_except GET HEAD { deny all; }
        root /opt/manga-chan-arbitrage/current/public/dashboard;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /dashboard/ {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600, immutable" always;
    }

    location / {
        return 404;
    }
}
