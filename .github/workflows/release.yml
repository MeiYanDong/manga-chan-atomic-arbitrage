name: Release artifact

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Build commit-addressed package
        run: git archive --format=tar.gz --prefix=manga-chan-atomic-arbitrage/ -o "manga-chan-atomic-arbitrage-${GITHUB_SHA}.tar.gz" HEAD
      - name: Write checksums and release identity
        run: |
          sha256sum manga-chan-atomic-arbitrage-*.tar.gz > SHA256SUMS
          git rev-parse HEAD > RELEASE_COMMIT
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: manga-chan-atomic-arbitrage-${{ github.sha }}
          path: |
            manga-chan-atomic-arbitrage-*.tar.gz
            SHA256SUMS
            RELEASE_COMMIT
          if-no-files-found: error
          retention-days: 30
